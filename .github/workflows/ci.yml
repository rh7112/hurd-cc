name: CI

# Lints (oxlint) and builds the site.
# Runs on pull requests so a broken build shows up on the PR instead of
# after merge. Deploy is deploy.yml.

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
